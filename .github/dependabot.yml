# Propositions de mise à jour des dépendances : chaque semaine, regroupées, et tout de suite pour une faille.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      outils:
        dependency-type: development
      application:
        dependency-type: production
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
