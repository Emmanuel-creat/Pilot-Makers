name: Vérifications

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Chaque lundi : nouvelles failles publiées sur des dépendances déjà installées.
    - cron: "0 6 * * 1"

jobs:
  securite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Secrets écrits par erreur
        run: npm run check:secrets
      - name: Failles connues des dépendances livrées
        run: npm audit --omit=dev --audit-level=high

  verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:texte
      - run: npm run check:regressions
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:calcul
      - run: npm run build

  parcours-navigateur:
    runs-on: ubuntu-latest
    needs: verifier
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:e2e
      - name: Aperçus des PDF
        if: always()
        run: sudo apt-get install -y poppler-utils && npm run pdf:apercus
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apercus-pdf
          path: apercus-pdf/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: rapport-parcours-navigateur
          path: |
            playwright-report/
            test-results/
          retention-days: 7
