name: Tests de mutation

on:
  workflow_dispatch:
  schedule:
    # Le premier du mois : les tests des calculs détectent-ils toujours les erreurs introduites ?
    - cron: "0 5 1 * *"

jobs:
  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:mutation
      - uses: actions/upload-artifact@v4
        with:
          name: rapport-mutation
          path: docs/MUTATION.md
